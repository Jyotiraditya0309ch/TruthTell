name: TruthTell CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend smoke test
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-django-key
      MONGODB_URI: mongodb://localhost:27017
    defaults:
      run:
        working-directory: Primary Backend/Fake_News_Detection_Backend/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .
      - run: python -m pip install -r requirements-ci.txt
      - run: python manage.py test analysepost
